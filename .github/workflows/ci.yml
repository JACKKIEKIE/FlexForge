name: FlexForge reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver
        run: python -m pip install -r requirements.txt
      - name: Run unit tests (100 deterministic seeds)
        run: python -m unittest -v test_flexforge.py
      - name: Verify dependency-free recovery
        run: python flexforge_demo.py --engine heuristic --out output/heuristic
      - name: Execute real OR-Tools CP-SAT recovery
        run: |
          python flexforge_demo.py --engine cpsat --seconds 2 --out output/cpsat
          python -c "import json; r=json.load(open('output/cpsat/summary.json')); assert r['status'] in ('OPTIMAL', 'FEASIBLE'), r"
      - name: Run 100-seed CP-SAT benchmark
        run: python flexforge_demo.py --engine cpsat --seconds 2 --bench 100 --out output/benchmark
      - name: Publish reproducible results as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexforge-verified-results
          path: output/
